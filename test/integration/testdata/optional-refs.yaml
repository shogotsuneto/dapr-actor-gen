openapi: 3.0.3
info:
  title: Optional Reference Test API
  description: Test API for optional object references
  version: 1.0.0

servers:
  - url: http://localhost:3500/v1.0/actors

paths:
  /Test/{actorId}/method/GetState:
    get:
      summary: Get state with optional references
      parameters:
        - in: path
          name: actorId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: State with optional object references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterState'

components:
  schemas:
    CounterState:
      type: object
      description: Current state of the counter actor (state-based)
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        data:
          $ref: '#/components/schemas/CounterStateData'
        error:
          $ref: '#/components/schemas/Error'
        # Optional non-struct references (type aliases)
        userId:
          $ref: '#/components/schemas/UserId'
        sessionToken:
          $ref: '#/components/schemas/SessionToken'
        # Optional enum reference
        operationStatus:
          $ref: '#/components/schemas/OperationStatus'
      additionalProperties: false

    CounterStateData:
      type: object
      description: Data payload for counter state
      properties:
        value:
          type: integer
          description: The counter value
        timestamp:
          type: string
          format: date-time
          description: When the value was set

    Error:
      type: object
      description: Error information
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message

    # Type aliases (non-struct types)
    UserId:
      type: string
      pattern: '^[a-zA-Z0-9_-]+$'
      description: Unique user identifier

    SessionToken:
      type: string
      description: Session authentication token

    # Enum type
    OperationStatus:
      type: string
      enum:
        - pending
        - completed
        - failed
        - cancelled
      description: Status of an operation